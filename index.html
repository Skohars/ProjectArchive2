  Cara pakai di WordPress: tambah blok "HTML Kustom", tempel SELURUH isi file ini.
  Cara mengubah isi: edit teks di dalam KV_CONFIG di bawah ini (tidak perlu CSS),
  atau pakai tombol roda gigi di pojok kanan bawah, lalu "Salin Config".
===================================================== -->
<script>
window.KV_CONFIG = {
  tema: "terang",                          // "terang" atau "gelap"
  warna: { utama: "#2d8cff", aksen: "#ffd23f" },
  panelEdit: true,                         // ganti ke false sebelum dipublikasikan
  tampil: { biodata: true, skill: true, proyek: true, riwayat: true, kontak: true },

  sapaan: "Halo, Sensei! Saya",
  nama: "Abdul Ghani",
  panggilan: "Bng.Kohar",
  peran: ["Mahasiswa", "Pembuat Website", "Pebisnis Muda"],
  tagline: "Mahasiswa Universitas Pamulang Serang yang suka membuat website, desain, dan aplikasi.",
  foto: "",                                // isi link gambar (https://...) atau kosongkan
  tentang: "Tulis perkenalan singkat tentang dirimu di sini: siapa kamu, apa yang kamu pelajari, dan apa yang sedang kamu kerjakan.",

  biodata: [
    ["Nama lengkap", "Abdul Ghani"],
    ["Panggilan", "Bng.Kohar"],
    ["Kampus", "Universitas Pamulang Serang"],
    ["Jurusan", "Isi jurusanmu"],
    ["Domisili", "Indonesia"],
    ["Hobi", "Isi hobimu"]
  ],

  skill: [
    ["Desain web (HTML dan CSS)", 80],
    ["Canva dan Figma", 75],
    ["Flutter dan Dart", 60],
    ["Komunikasi", 85]
  ],

  proyek: [
    { judul: "Website E-Commerce Gadget", deskripsi: "Toko online statis untuk ponsel, laptop, dan tablet dengan tampilan bernuansa Blue Archive.", tag: ["HTML", "CSS"], link: "" },
    { judul: "Desain Website Warnet", deskripsi: "Rancangan halaman registrasi, login, billing, serta menu makanan dan minuman.", tag: ["Canva", "UI"], link: "" },
    { judul: "Proyek Ketiga", deskripsi: "Ganti dengan proyek terbaikmu. Tambahkan link agar tombol Buka muncul.", tag: ["Tag"], link: "" }
  ],

  riwayat: [
    { tahun: "Sekarang", judul: "Mahasiswa, Universitas Pamulang Serang", ket: "Tulis fokus studi atau kegiatan kampusmu." },
    { tahun: "20XX", judul: "Pengalaman atau pelatihan", ket: "Tulis apa yang kamu kerjakan dan pelajari." },
    { tahun: "20XX", judul: "Pendidikan sebelumnya", ket: "Isi nama sekolah atau kursus." }
  ],

  kontak: [
    { label: "WhatsApp", isi: "08xx-xxxx-xxxx", link: "https://wa.me/628xxxxxxxxxx" },
    { label: "Email", isi: "emailkamu@gmail.com", link: "mailto:emailkamu@gmail.com" },
    { label: "Instagram", isi: "@usernamekamu", link: "https://instagram.com/usernamekamu" }
  ]
};
</script>

<div id="kv"><div id="kva"></div></div>

<style>
#kv{--p:#2d8cff;--a:#ffd23f;--bg:#eaf4ff;--card:#fff;--tx:#0b2447;--mut:#546a8f;--ln:rgba(45,140,255,.22);font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg);line-height:1.6;position:relative;overflow-x:clip}
#kv.dark{--bg:#08152b;--card:#0f2547;--tx:#e8f2ff;--mut:#9bb4d8;--ln:rgba(120,180,255,.22)}
#kv *{box-sizing:border-box}
#kv h1,#kv h2{font-family:inherit;font-style:italic;font-weight:900;letter-spacing:-.01em;color:var(--tx);border:0;padding:0;text-transform:none}
#kv a{color:inherit}
#kv .nv{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 5vw;background:var(--card);border-bottom:3px solid var(--p)}
#kv .lg{font-style:italic;font-weight:900;font-size:1.15rem;color:#fff;background:var(--p);padding:2px 22px 2px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
#kv .lk{display:flex;gap:4px;overflow-x:auto}
#kv .lk a{padding:6px 12px;font-weight:700;font-size:.92rem;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
#kv .lk a:hover{border-color:var(--a);color:var(--p)}
#kv .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding:70px 6vw 90px;position:relative;background:repeating-linear-gradient(-45deg,transparent 0 16px,var(--ln) 16px 17px)}
#kv .hero::before{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;background:linear-gradient(160deg,var(--p),color-mix(in srgb,var(--p) 50%,#fff));clip-path:polygon(30% 0,100% 0,100% 100%,0 100%)}
#kv .hero>*{position:relative;z-index:1;animation:kvin .8s ease both}
#kv .chip{display:inline-block;background:var(--a);color:#0b2447;font-weight:800;padding:3px 22px 3px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
#kv h1{font-size:clamp(2.4rem,6.5vw,4.4rem);line-height:1.02;margin:14px 0 8px;text-shadow:4px 4px 0 var(--ln)}
#kv .rl{min-height:1.9em;font-size:1.25rem;font-weight:800;color:var(--p)}
#kv .cur{animation:kvb 1s steps(1) infinite;font-style:normal}
#kv .sb{max-width:30em;color:var(--mut);margin:6px 0 26px}
#kv .btn{border:0;cursor:pointer;font:inherit;font-weight:800;padding:12px 32px;margin:0 10px 10px 0;background:var(--p);color:#fff;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
#kv .btn.gh{background:var(--a);color:#0b2447}
#kv .btn:hover{filter:brightness(1.1)}
#kv .av{position:relative;justify-self:center;width:min(300px,72vw);aspect-ratio:1;margin-top:20px}
#kv .halo{position:absolute;z-index:2;top:-30px;left:50%;width:124px;height:40px;margin-left:-62px;border:6px solid var(--a);border-radius:50%;box-shadow:0 0 18px var(--a),inset 0 0 10px var(--a);animation:kvf 3.2s ease-in-out infinite}
#kv .fw{width:100%;height:100%;filter:drop-shadow(10px 10px 0 var(--a))}
#kv .fr{width:100%;height:100%;background:var(--card);display:grid;place-items:center;font-size:6.5rem;font-weight:900;font-style:italic;color:var(--p);clip-path:polygon(0 0,calc(100% - 44px) 0,100% 44px,100% 100%,44px 100%,0 calc(100% - 44px));overflow:hidden}
#kv .fr img{width:100%;height:100%;object-fit:cover}
#kv .sc{padding:64px 6vw}
#kv h2{font-size:2rem;margin:0 0 26px;padding-left:16px;border-left:9px solid var(--a)}
#kv .gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
#kv .cd{display:block;background:var(--card);padding:18px 22px;border-left:5px solid var(--p);text-decoration:none;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
#kv .cd small{display:block;color:var(--mut);font-size:.82rem}
#kv .cd b{font-size:1.08rem}
#kv .cd p{margin:6px 0 0;color:var(--mut)}
#kv .cd.wide{margin-bottom:18px;border-left-color:var(--a)}
#kv a.cd:hover,#kv .pj:hover{background:color-mix(in srgb,var(--card) 88%,var(--p))}
#kv .tp{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
#kv .tp em{font-style:normal;color:var(--p)}
#kv .bar{height:13px;background:var(--ln);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
#kv .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--a));transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
#kv .in .bar i{width:var(--w)}
#kv .tg{display:inline-block;margin:10px 6px 0 0;padding:2px 12px;background:var(--p);color:#fff;font-size:.8rem;font-weight:700;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
#kv .ln{display:inline-block;margin-top:12px;color:var(--p);font-weight:800;text-decoration:none;border-bottom:3px solid var(--a)}
#kv .tl{border-left:4px solid var(--p);margin-left:8px;padding-left:26px}
#kv .it{position:relative;margin-bottom:26px}
#kv .it::before{content:"";position:absolute;left:-36px;top:7px;width:16px;height:16px;background:var(--a);border:3px solid var(--p);transform:rotate(45deg)}
#kv .it small{color:var(--p);font-weight:800;font-size:.9rem}
#kv .it b{display:block;font-size:1.1rem}
#kv .it p{margin:2px 0;color:var(--mut)}
#kv .ft{padding:26px 6vw;text-align:center;background:var(--p);color:#fff;font-weight:700}
#kv .gear{position:fixed;right:18px;bottom:18px;z-index:60;width:50px;height:50px;border:0;border-radius:50%;background:var(--a);color:#0b2447;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#kv .pn{display:none;position:fixed;right:18px;bottom:80px;z-index:60;width:min(390px,calc(100vw - 36px));max-height:75vh;overflow:auto;background:var(--card);color:var(--tx);padding:16px;border:3px solid var(--p)}
#kv .pn.op{display:block}
#kv .pn p{font-size:.82rem;color:var(--mut);margin:6px 0}
#kv .pn textarea{width:100%;height:220px;font:12px/1.4 Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:8px}
#kv .rw{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700}
#kv .pn .btn{padding:8px 20px;font-size:.88rem}
#kv button:focus-visible,#kv a:focus-visible,#kv textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
@keyframes kvin{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes kvb{50%{opacity:0}}
@keyframes kvf{50%{transform:translateY(-8px)}}
@media(max-width:760px){#kv .hero{grid-template-columns:1fr;padding-top:50px}#kv .hero::before{width:100%;top:auto;height:42%;clip-path:polygon(0 28%,100% 0,100% 100%,0 100%)}}
@media(prefers-reduced-motion:reduce){#kv *{animation:none!important;transition:none!important}}
</style>

<script>
(function () {
  var C, root = document.getElementById('kv'), app = document.getElementById('kva'), tm;
  function fix() {
    C.warna = Object.assign({ utama: '#2d8cff', aksen: '#ffd23f' }, C.warna);
    C.tampil = C.tampil || {};
  }
  C = JSON.parse(JSON.stringify(window.KV_CONFIG || {})); fix();

  function h(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function ok(u) { return /^(https?:|mailto:|tel:)/i.test(u || '') ? u : ''; }
  function go(id) { var e = document.getElementById('kv-' + id); if (e) e.scrollIntoView({ behavior: 'smooth' }); }
  function sec(id, t) { var s = h('section', 'sc'); s.id = 'kv-' + id; s.appendChild(h('h2', '', t)); return s; }

  function render() {
    var t = C.tampil;
    root.classList.toggle('dark', C.tema === 'gelap');
    root.style.setProperty('--p', C.warna.utama);
    root.style.setProperty('--a', C.warna.aksen);
    clearInterval(tm); app.textContent = '';

    var nav = h('nav', 'nv'), lk = h('div', 'lk');
    nav.appendChild(h('span', 'lg', C.panggilan || C.nama));
    [['biodata', 'Biodata'], ['skill', 'Skill'], ['proyek', 'Proyek'], ['riwayat', 'Riwayat'], ['kontak', 'Kontak']].forEach(function (m) {
      if (t[m[0]] === false) return;
      var a = h('a', '', m[1]); a.href = '#';
      a.onclick = function (e) { e.preventDefault(); go(m[0]); };
      lk.appendChild(a);
    });
    nav.appendChild(lk); app.appendChild(nav);

    var hr = h('header', 'hero'), tx = h('div'), ty = h('span'), rl = h('div', 'rl');
    rl.append(ty, h('span', 'cur', '|'));
    tx.append(h('span', 'chip', C.sapaan), h('h1', '', C.nama), rl, h('p', 'sb', C.tagline));
    var b1 = h('button', 'btn', 'Lihat proyek'), b2 = h('button', 'btn gh', 'Hubungi saya');
    b1.onclick = function () { go('proyek'); }; b2.onclick = function () { go('kontak'); };
    tx.append(b1, b2);
    var av = h('div', 'av'), fw = h('div', 'fw'), fr = h('div', 'fr');
    av.appendChild(h('div', 'halo'));
    if (/^(https?:|data:image)/i.test(C.foto || '')) { var im = h('img'); im.src = C.foto; im.alt = C.nama; fr.appendChild(im); }
    else fr.appendChild(h('span', '', (C.nama || '?').trim().charAt(0).toUpperCase()));
    fw.appendChild(fr); av.appendChild(fw); hr.append(tx, av); app.appendChild(hr);

    var roles = (C.peran && C.peran.length) ? C.peran : [''], ri = 0, ci = 0, del = false;
    tm = setInterval(function () {
      var r = roles[ri];
      if (!del) { ci++; if (ci > r.length + 14) del = true; }
      else { ci--; if (ci <= 0) { del = false; ri = (ri + 1) % roles.length; } }
      ty.textContent = r.slice(0, ci);
    }, 90);

    var s, g;
    if (t.biodata !== false) {
      s = sec('biodata', 'Biodata');
      if (C.tentang) { var ab = h('div', 'cd wide'); ab.append(h('b', '', 'Tentang saya'), h('p', '', C.tentang)); s.appendChild(ab); }
      g = h('div', 'gr');
      (C.biodata || []).forEach(function (r) { var c = h('div', 'cd'); c.append(h('small', '', r[0]), h('b', '', r[1])); g.appendChild(c); });
      s.appendChild(g); app.appendChild(s);
    }
    if (t.skill !== false) {
      s = sec('skill', 'Skill'); s.classList.add('rv'); g = h('div', 'gr');
      (C.skill || []).forEach(function (r) {
        var d = h('div', 'cd'), tp = h('div', 'tp'), bar = h('div', 'bar'), i = h('i');
        tp.append(h('span', '', r[0]), h('em', '', (+r[1] || 0) + '%'));
        i.style.setProperty('--w', Math.max(0, Math.min(100, +r[1] || 0)) + '%');
        bar.appendChild(i); d.append(tp, bar); g.appendChild(d);
      });
      s.appendChild(g); app.appendChild(s);
    }
    if (t.proyek !== false) {
      s = sec('proyek', 'Proyek'); g = h('div', 'gr');
      (C.proyek || []).forEach(function (p) {
        var c = h('div', 'cd pj'); c.append(h('b', '', p.judul), h('p', '', p.deskripsi));
        (p.tag || []).forEach(function (x) { c.appendChild(h('span', 'tg', x)); });
        if (ok(p.link)) { c.appendChild(h('br')); var a = h('a', 'ln', 'Buka proyek'); a.href = ok(p.link); a.target = '_blank'; a.rel = 'noopener'; c.appendChild(a); }
        g.appendChild(c);
      });
      s.appendChild(g); app.appendChild(s);
    }
    if (t.riwayat !== false) {
      s = sec('riwayat', 'Riwayat'); g = h('div', 'tl');
      (C.riwayat || []).forEach(function (r) { var d = h('div', 'it'); d.append(h('small', '', r.tahun), h('b', '', r.judul), h('p', '', r.ket)); g.appendChild(d); });
      s.appendChild(g); app.appendChild(s);
    }
    if (t.kontak !== false) {
      s = sec('kontak', 'Kontak'); g = h('div', 'gr');
      (C.kontak || []).forEach(function (k) {
        var l = ok(k.link), c = h(l ? 'a' : 'div', 'cd');
        if (l) { c.href = l; c.target = '_blank'; c.rel = 'noopener'; }
        c.append(h('small', '', k.label), h('b', '', k.isi)); g.appendChild(c);
      });
      s.appendChild(g); app.appendChild(s);
    }
    app.appendChild(h('footer', 'ft', '© ' + new Date().getFullYear() + ' ' + (C.nama || '')));

    var rv = app.querySelectorAll('.rv');
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .15 });
      rv.forEach(function (e) { io.observe(e); });
    } else rv.forEach(function (e) { e.classList.add('in'); });
  }

  function panel() {
    if (C.panelEdit === false && location.hash !== '#edit') return;
    var gear = h('button', 'gear', '⚙'), pn = h('div', 'pn'), ta = h('textarea'), msg = h('p');
    gear.title = 'Edit portofolio'; ta.spellcheck = false;
    function sync() { ta.value = JSON.stringify(C, null, 2); }
    function row(l, el) { var r = h('label', 'rw'); r.append(h('span', '', l), el); return r; }
    function inp(k) { var i = h('input'); i.type = 'color'; i.value = C.warna[k]; i.oninput = function () { C.warna[k] = i.value; render(); sync(); }; return i; }
    var tema = h('select'); ['terang', 'gelap'].forEach(function (v) { var o = h('option', '', v); o.value = v; tema.appendChild(o); });
    tema.value = C.tema === 'gelap' ? 'gelap' : 'terang';
    tema.onchange = function () { C.tema = tema.value; render(); sync(); };
    var ap = h('button', 'btn', 'Terapkan'), cp = h('button', 'btn gh', 'Salin config');
    ap.onclick = function () { try { C = JSON.parse(ta.value); fix(); render(); msg.textContent = 'Perubahan diterapkan.'; } catch (e) { msg.textContent = 'Format JSON salah: ' + e.message; } };
    cp.onclick = function () {
      var txt = 'window.KV_CONFIG = ' + JSON.stringify(C, null, 2) + ';';
      function fb() { ta.value = txt; ta.select(); document.execCommand('copy'); }
      (navigator.clipboard ? navigator.clipboard.writeText(txt).catch(fb) : Promise.resolve(fb())).then(function () { msg.textContent = 'Config disalin. Tempel menggantikan window.KV_CONFIG di kode agar permanen.'; });
    };
    pn.append(h('b', '', 'Edit portofolio'), row('Warna utama', inp('utama')), row('Warna aksen', inp('aksen')), row('Tema', tema),
      h('p', '', 'Ubah isi di kotak berikut, lalu klik Terapkan untuk melihat hasilnya.'), ta, ap, cp, msg);
    gear.onclick = function () { pn.classList.toggle('op'); };
    root.append(pn, gear); sync();
  }
  render(); panel();
})();
</script>
